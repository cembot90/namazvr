name: Tests

on:
  # Nur die veröffentlichte Version (main) und Pull Requests prüfen – Zwischenstände auf dem Arbeitszweig
  # (z. B. halb fertige Übersetzungen) lösen sonst Fehler-Mails aus
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein neuer Lauf für denselben Zweig ersetzt den alten
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
