<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NamazVR – Gebetsassistent</title>
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #hint {
      position: fixed; left: 16px; bottom: 16px; max-width: 380px;
      color: #cfd8e3; background: rgba(10, 16, 28, .8); border: 1px solid #3a4a66;
      padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.55;
    }
    #hint b { color: #e6c77f; }
    #ui { display: none; }
    /* VR- und Mixed-Reality-Knopf nebeneinander */
    #VRButton { left: auto !important; right: 206px; width: 170px !important; }
    #ARButton { left: auto !important; right: 20px; width: 170px !important; }

    /* Handy: oben die 3D-Szene mit der Figur, darunter die Bedienung */
    body.mobile { overflow: hidden; }
    body.mobile #hint, body.mobile #VRButton, body.mobile #ARButton { display: none !important; }
    body.mobile canvas:first-of-type { display: block; }
    body.mobile #ui {
      --gold: #e6c77f; --muted: #9fb0c6; --btn: #1d2b45; --line: rgba(201,168,92,.35);
      display: block; position: fixed; left: 0; right: 0; bottom: 0; top: 36vh;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: #0a1220; color: #eef2f7; border-top: 2px solid #c9a85c;
      padding: 14px 16px calc(96px + env(safe-area-inset-bottom)); box-sizing: border-box;
      font-size: 16px; line-height: 1.45;
    }
    #ui header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    #ui h2 { margin: 0; color: var(--gold); font-size: 22px; }
    #ui h3 { margin: 18px 0 8px; font-size: 16px; }
    #ui header span { color: var(--muted); font-size: 13px; text-align: right; }
    #ui p { margin: 8px 0; }
    #ui button {
      font: inherit; color: inherit; background: var(--btn); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 10px; min-height: 48px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    #ui button:active { filter: brightness(1.25); }
    #ui button small { font-weight: 400; color: var(--gold); font-size: 12px; }
    #ui button.primary { background: #24785a; }
    #ui button.active { background: #7a5f22; }
    #ui button.wrong { outline: 3px solid #d9645a; }
    #ui button.wide { width: 100%; margin-top: 10px; }
    #ui button.huge { width: 100%; min-height: 72px; font-size: 22px; margin: 12px 0; }
    #ui .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    #ui .grid5 button { padding: 10px 2px; font-size: 14px; }
    #ui .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    #ui .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    #ui .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    #ui .list button { align-items: flex-start; text-align: left; padding: 12px 14px; }
    #ui .row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--btn); text-align: left; }
    #ui button.row { flex-direction: row; display: grid; }
    #ui .row.dim { background: rgba(29,43,69,.5); color: var(--muted); }
    #ui .row em { color: var(--gold); font-style: normal; font-size: 13px; }
    #ui .row b { font-size: 18px; }
    #ui .gold { color: var(--gold); font-weight: 600; }
    #ui .muted { color: var(--muted); }
    #ui .small { font-size: 13px; }
    #ui .center { text-align: center; }
    #ui .ok { color: #7fd1a8; font-weight: 600; }
    #ui .grid2 .wide { grid-column: 1 / -1; margin-top: 0; }
    #ui hr { border: 0; border-top: 1px solid rgba(201,168,92,0.25); margin: 10px 0; }
    #ui ol.steps { margin: 8px 0 10px; padding-inline-start: 22px; line-height: 1.45; }
    #ui ol.steps li { margin-bottom: 6px; }
    #ui .bad { color: #e8908a; font-weight: 600; }
    #ui .bar { height: 6px; background: #24324d; border-radius: 3px; overflow: hidden; margin: 6px 0 12px; }
    #ui .bar i { display: block; height: 100%; background: var(--gold); }
    #ui .move { display: flex; gap: 12px; align-items: center; background: rgba(36,50,77,.7); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    #ui .move canvas { width: 96px; height: 96px; flex: none; }
    #ui .move b { color: var(--gold); font-size: 19px; }
    #ui .move p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    #ui .inner { color: var(--gold); font-style: italic; }
    #ui .stars { display: flex; flex-wrap: wrap; gap: 2px 4px; font-size: 20px; color: #4a5a78; margin-top: 4px; }
    #ui .stars i { font-style: normal; }
    #ui .stars i.on { color: var(--gold); text-shadow: 0 0 6px rgba(230,199,127,0.7); }
    #ui .rec .ar { font-family: Amiri, "Geeza Pro", serif; font-size: 28px; text-align: right; margin: 6px 0; line-height: 1.7; }
    #ui .ar.big { font-size: 44px; text-align: center; }
    #ui .rec .tr, #ui .tr { color: var(--gold); font-style: italic; }
    #ui .dock {
      position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1.3fr 1.2fr 1fr 1fr 2fr; gap: 6px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(10,18,32,.96); border-top: 1px solid var(--line);
    }
    #ui .dock button { padding: 10px 4px; }
    #ui .dock p { grid-column: 1 / -1; margin: 0; }
    #ui .count { font-size: 56px; font-weight: 700; text-align: center; margin: 10px 0 0; }
    #ui .question { font-size: 20px; font-weight: 600; }
    #ui .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    #ui .stats div { background: var(--btn); border-radius: 12px; padding: 10px 4px; text-align: center; }
    #ui .stats b { display: block; font-size: 24px; color: var(--gold); }
    #ui .stats small { color: var(--muted); font-size: 11px; }
    #ui .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    #ui .badges span { background: rgba(29,43,69,.6); color: var(--muted); padding: 6px 10px; border-radius: 10px; font-size: 13px; }
    #ui .badges span.ok { background: #7a5f22; color: #fff; }
    #ui .notes { color: var(--muted); font-size: 14px; padding-left: 18px; }
    #ui .setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
    #ui .setting small { display: block; color: var(--muted); font-size: 13px; }
    #ui .setting button { min-width: 80px; }
    #ui .voice { background: rgba(29,43,69,.6); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
    #ui .voice.cur { background: rgba(122,95,34,.4); }
    #ui .voice small { display: block; color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
    #ui .voice small.bad { color: #e8908a; }
    #ui .voice a { color: var(--gold); }
    #ui .voice button.icon { font-size: 22px; padding: 2px 8px; min-width: 0; margin-right: 4px; }
    #ui .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0; text-align: center; }
    #ui .week div { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; border-radius: 10px; }
    #ui .week div.sel { background: rgba(122,95,34,.4); }
    #ui .week b { font-size: 13px; }
    #ui .week small { font-size: 11px; color: var(--muted); }
    #ui .week i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(201,168,92,.5); box-sizing: border-box; }
    #ui .week i.on { background: var(--gold); border-color: var(--gold); }
    #ui .week em { font-style: normal; color: var(--gold); min-height: 16px; }
    #ui .compass { display: flex; justify-content: center; margin: 12px 0; }
    #ui .dial { position: relative; width: 200px; height: 200px; border-radius: 50%; border: 3px solid #c9a85c; background: radial-gradient(#13223a, #0a1220); }
    #ui .dial .n { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 14px; }
    #ui .needle { position: absolute; left: 50%; top: 50%; width: 6px; height: 80px; background: var(--gold); border-radius: 3px; transform-origin: 50% 100%; transform: translate(-50%, -100%); transition: transform .15s linear; }
    #ui .needle.ok { background: #7fd1a8; }
    #ui .needle span { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 24px; }
    #ui .breath { width: 70px; height: 70px; margin: 16px auto 4px; border-radius: 50%; background: radial-gradient(#bff0dc, #2f9670); }
    #ui .breath.in { animation: grow 3s ease-in-out forwards; }
    #ui .breath.out { animation: shrink 3s ease-in-out forwards; }
    /* Arabisch: von rechts nach links */
    html[dir="rtl"] #ui, html[dir="rtl"] #hint { font-family: "Noto Sans Arabic", "Geeza Pro", Inter, sans-serif; }
    html[dir="rtl"] #ui header span { text-align: left; }
    html[dir="rtl"] #ui .list button { align-items: flex-start; text-align: right; }
    html[dir="rtl"] #ui .row { text-align: right; }
    html[dir="rtl"] #ui .notes { padding-left: 0; padding-right: 18px; }
    @keyframes grow { from { transform: scale(.6); } to { transform: scale(1.4); } }
    @keyframes shrink { from { transform: scale(1.4); } to { transform: scale(.6); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">
    <b>Ohne Headset:</b> Maus ziehen = umsehen · Klick = Button · ← / → = Schritte · M = Menü<br>
    <b>Mit Meta Quest:</b> Seite im Quest-Browser öffnen → „ENTER VR“ · Trigger oder Pinch = auswählen
  </div>
  <div id="ui"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
