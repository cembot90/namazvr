<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NamazVR – Gebetsassistent</title>
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1322; --surface: #131e32; --surface-2: #1a2740; --surface-3: #22324f;
      --line: rgba(255,255,255,.09); --line-gold: rgba(230,199,127,.45);
      --gold: #e6c77f; --gold-soft: rgba(230,199,127,.14); --green: #23805f; --green-hi: #2c9a73;
      --text: #f0f3f8; --muted: #a9b7cb; --ok: #7fd1a8; --bad: #f0958e;
      --r: 14px; --r-sm: 10px;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* Start: Ladeanzeige, bis die App bereit ist – und eine verständliche Meldung, falls etwas nicht lädt */
    #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
      background: radial-gradient(120% 90% at 50% 30%, #16233b 0%, var(--bg) 70%); color: var(--text); transition: opacity .35s ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .logo { font-size: 44px; line-height: 1; }
    #boot h1 { margin: 0; font-size: 28px; color: var(--gold); letter-spacing: .01em; }
    #boot p { margin: 0; color: var(--muted); font-size: 15px; max-width: 30em; line-height: 1.5; }
    #boot .spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--gold); animation: spin .9s linear infinite; }
    #boot.err .spin { display: none; }
    #boot button { display: none; font: inherit; font-weight: 600; color: var(--text); background: var(--green); border: 0; border-radius: var(--r); padding: 12px 22px; min-height: 48px; cursor: pointer; }
    #boot.err button { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Computer: Hinweis zur Bedienung unten links, einklappbar */
    #hint {
      position: fixed; left: 16px; bottom: 16px; max-width: 400px;
      color: #d6deea; background: rgba(11,19,34,.86); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,.35);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding: 12px 40px 12px 14px; border-radius: var(--r); font-size: 13px; line-height: 1.6;
    }
    #hint b { color: var(--gold); }
    #hint .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
    #hint .x:hover { background: var(--surface-3); color: var(--text); }
    #hint.min { padding: 0; border-radius: 50%; width: 40px; height: 40px; overflow: hidden; }
    #hint.min > :not(.x) { display: none; }
    #hint.min { font-size: 0; }
    #hint.min .x { position: static; width: 40px; height: 40px; font-size: 18px; color: var(--gold); }
    #ui { display: none; }
    /* VR- und Mixed-Reality-Knopf nebeneinander, im Stil der App; nicht verfügbare Knöpfe werden ausgeblendet */
    #VRButton, #ARButton { left: auto !important; width: 170px !important; bottom: 16px !important; border-radius: var(--r) !important; border: 1px solid var(--line-gold) !important;
      background: rgba(11,19,34,.86) !important; color: var(--text) !important; font: 600 13px Inter, system-ui, sans-serif !important; opacity: 1 !important; letter-spacing: .04em; }
    #VRButton { right: 202px; } #ARButton { right: 16px; }
    #VRButton.off, #ARButton.off { display: none !important; }

    /* Handy: oben die 3D-Szene mit der Figur, darunter die Bedienung */
    body.mobile { overflow: hidden; }
    body.mobile #hint, body.mobile #VRButton, body.mobile #ARButton { display: none !important; }
    body.mobile canvas:first-of-type { display: block; }
    body.mobile #ui {
      display: block; position: fixed; left: 0; right: 0; bottom: 0; top: calc(36vh - 18px);
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      background: var(--bg); color: var(--text); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.45), 0 -1px 0 var(--line-gold);
      padding: 0 16px calc(28px + env(safe-area-inset-bottom)); box-sizing: border-box;
      font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
    }
    body.mobile #ui[data-view="step"] { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
    #ui * { box-sizing: border-box; }

    /* Kopfzeile bleibt beim Scrollen stehen */
    #ui header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; min-height: 56px; margin: 0 -16px 10px; padding: 10px 16px 8px;
      background: linear-gradient(var(--bg) 78%, rgba(11,19,34,0)); }
    #ui header h2 { margin: 0; color: var(--gold); font-size: 21px; line-height: 1.2; font-weight: 700; flex: 1; min-width: 0; text-wrap: balance; }
    #ui header > span { color: var(--muted); font-size: 13px; text-align: right; max-width: 45%; line-height: 1.3; }
    #ui header .back { flex: none; width: 40px; min-width: 40px; height: 40px; min-height: 40px; padding: 0 0 3px; border-radius: 50%; font-size: 26px; line-height: 1; background: var(--surface-2); }
    #ui h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 600; }
    #ui h4 { margin: 22px 2px 8px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
    #ui p { margin: 8px 0; }
    #ui a { color: var(--gold); }

    /* Knöpfe: neutral, Hauptaktion (grün) und gewählt (goldener Rand) */
    #ui button {
      font: inherit; color: inherit; background: var(--surface-2); border: 1px solid var(--line);
      border-radius: var(--r); padding: 11px 12px; min-height: 48px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;
      transition: background .12s ease, transform .08s ease, border-color .12s ease;
    }
    #ui button:active { transform: scale(.97); background: var(--surface-3); }
    #ui button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #ui button small { font-weight: 500; color: var(--muted); font-size: 12px; line-height: 1.3; }
    #ui button.primary { background: var(--green); border-color: transparent; color: #fff; }
    #ui button.primary:active { background: var(--green-hi); }
    #ui button.primary small { color: rgba(255,255,255,.82); }
    #ui button.active { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
    #ui button.active small { color: var(--gold); opacity: .85; }
    #ui button.wrong { outline: 3px solid var(--bad); }
    #ui button.wide { width: 100%; margin-top: 10px; }
    #ui button.huge { width: 100%; min-height: 84px; font-size: 22px; margin: 14px 0; border-radius: 18px; }

    /* Startseite */
    #ui .next { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); margin-bottom: 10px;
      background: linear-gradient(135deg, rgba(230,199,127,.16), rgba(35,128,95,.14)); border: 1px solid var(--line-gold); }
    #ui .next .ico { font-size: 28px; flex: none; }
    #ui .next b { display: block; color: var(--gold); font-size: 16px; line-height: 1.35; }
    #ui .next small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    #ui .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    #ui .grid5 button { padding: 10px 2px; font-size: 14px; min-height: 58px; }
    #ui .grid5 button small { font-size: 11px; white-space: nowrap; }
    #ui .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    #ui .tile { min-height: 84px; padding: 10px 6px; gap: 6px; font-size: 13.5px; line-height: 1.25; font-weight: 600; hyphens: auto; overflow-wrap: anywhere; }
    #ui .tile .ico { font-size: 26px; line-height: 1; }

    #ui .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    #ui .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    #ui .grid3 button { padding-inline: 6px; font-size: 15px; }
    #ui .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    #ui .list button { align-items: flex-start; text-align: start; padding: 12px 14px; gap: 3px; }
    #ui .row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 13px 14px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); text-align: start; min-height: 54px; }
    #ui button.row { flex-direction: row; display: grid; }
    #ui .row.dim { background: transparent; color: var(--muted); border-style: dashed; }
    #ui .row em { color: var(--gold); font-style: normal; font-size: 13px; font-weight: 500; }
    #ui .row b { font-size: 18px; font-variant-numeric: tabular-nums; }
    #ui .gold { color: var(--gold); font-weight: 600; }
    #ui .muted { color: var(--muted); }
    #ui .small { font-size: 13.5px; line-height: 1.5; }
    #ui .center { text-align: center; }
    #ui .ok { color: var(--ok); font-weight: 600; }
    #ui .bad { color: var(--bad); font-weight: 600; }
    #ui .grid2 .wide { grid-column: 1 / -1; margin-top: 0; }
    #ui hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    #ui ol.steps { margin: 8px 0 10px; padding-inline-start: 22px; line-height: 1.5; }
    #ui ol.steps li { margin-bottom: 6px; }
    #ui .bar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin: 0 0 12px; }
    #ui .bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .25s ease; }

    /* Schritt im Gebet */
    #ui .move { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line-gold); border-radius: 16px; padding: 10px 12px; }
    #ui .move canvas { width: 88px; height: 88px; flex: none; }
    #ui .move b { color: var(--gold); font-size: 19px; line-height: 1.25; }
    #ui .move p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
    #ui .inner { color: var(--gold); font-style: italic; }
    #ui .rec { margin-top: 12px; padding: 4px 14px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    #ui .rec:empty { display: none; }
    #ui .rec .ar { font-family: Amiri, "Geeza Pro", serif; font-size: 29px; text-align: right; margin: 8px 0; line-height: 1.85; }
    #ui .ar.big { font-family: Amiri, "Geeza Pro", serif; font-size: 40px; line-height: 1.7; text-align: center; margin: 14px 0 6px; }
    #ui .rec .tr, #ui .tr { color: var(--gold); font-style: italic; }
    #ui .rec .tr { margin-top: 10px; }
    #ui .rec .de { color: var(--text); }
    #ui .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: .8fr 1fr 1fr 1.1fr 1.1fr 1.9fr; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: rgba(11,19,34,.94); border-top: 1px solid var(--line);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    #ui .dock button { padding: 6px 2px; min-height: 56px; font-size: 18px; gap: 1px; }
    #ui .dock button small { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #ui .dock button.primary { font-size: 16px; }
    #ui .dock button.txt { font-size: 14px; }
    #ui .dock p { grid-column: 1 / -1; margin: 0; }

    #ui .count { font-size: 60px; font-weight: 700; text-align: center; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
    #ui .question { font-size: 20px; font-weight: 600; line-height: 1.35; }
    #ui .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    #ui .stats div { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 4px; text-align: center; }
    #ui .stats b { display: block; font-size: 24px; color: var(--gold); font-variant-numeric: tabular-nums; }
    #ui .stats small { color: var(--muted); font-size: 11px; }
    #ui .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    #ui .badges span { background: var(--surface); border: 1px solid var(--line); color: var(--muted); padding: 6px 10px; border-radius: 999px; font-size: 13px; }
    #ui .badges span.ok { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
    #ui .notes { color: var(--muted); font-size: 14px; padding-inline-start: 20px; margin: 10px 0 0; }
    #ui .notes li { margin-bottom: 3px; }
    #ui .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
    #ui .setting small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
    #ui .setting button { min-width: 72px; flex: none; }
    #ui .voice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-top: 10px; }
    #ui .voice.cur { border-color: var(--line-gold); background: linear-gradient(var(--gold-soft), var(--gold-soft)), var(--surface); }
    #ui .voice > b { display: flex; align-items: center; gap: 4px; }
    #ui .voice small { display: block; color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
    #ui .voice small.bad { color: var(--bad); }
    #ui .voice button.icon { font-size: 22px; padding: 2px 8px; min-width: 48px; display: inline-flex; margin-inline-end: 6px; }
    #ui .stars { display: flex; flex-wrap: wrap; gap: 2px 4px; font-size: 20px; color: #51607d; margin-top: 6px; }
    #ui .stars i { font-style: normal; }
    #ui .stars i.on { color: var(--gold); text-shadow: 0 0 6px rgba(230,199,127,0.7); }
    #ui .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 12px 0; text-align: center; }
    #ui .week div { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: var(--r-sm); border: 1px solid transparent; }
    #ui .week div.sel { background: var(--gold-soft); border-color: var(--line-gold); }
    #ui .week b { font-size: 13px; }
    #ui .week small { font-size: 11px; color: var(--muted); }
    #ui .week i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(230,199,127,.45); }
    #ui .week i.on { background: var(--gold); border-color: var(--gold); }
    #ui .week em { font-style: normal; color: var(--gold); min-height: 16px; }
    #ui .compass { display: flex; justify-content: center; margin: 14px 0; }
    #ui .dial { position: relative; width: 210px; height: 210px; border-radius: 50%; border: 3px solid var(--gold); background: radial-gradient(#17263f, var(--bg)); box-shadow: inset 0 0 0 8px rgba(230,199,127,.08); }
    #ui .dial .n { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 14px; }
    #ui .needle { position: absolute; left: 50%; top: 50%; width: 6px; height: 82px; background: var(--gold); border-radius: 3px; transform-origin: 50% 100%; transform: translate(-50%, -100%); transition: transform .15s linear; }
    #ui .needle.ok { background: var(--ok); }
    #ui .needle span { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 24px; }
    #ui .breath { width: 70px; height: 70px; margin: 18px auto 6px; border-radius: 50%; background: radial-gradient(#bff0dc, #2f9670); }
    #ui .breath.in { animation: grow 3s ease-in-out forwards; }
    #ui .breath.out { animation: shrink 3s ease-in-out forwards; }
    /* Arabisch: von rechts nach links */
    html[dir="rtl"] #ui, html[dir="rtl"] #hint, html[dir="rtl"] #boot { font-family: "Noto Sans Arabic", "Geeza Pro", Inter, sans-serif; }
    html[dir="rtl"] #ui header > span { text-align: left; }
    html[dir="rtl"] #ui h4 { letter-spacing: 0; font-size: 14px; }
    @keyframes grow { from { transform: scale(.6); } to { transform: scale(1.4); } }
    @keyframes shrink { from { transform: scale(1.4); } to { transform: scale(.6); } }
    @media (prefers-reduced-motion: reduce) {
      #ui button, #ui .bar i, #boot { transition: none; }
      #boot .spin { animation-duration: 2.4s; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">
    <b>Ohne Headset:</b> Maus ziehen = umsehen · Klick = Button · ← / → = Schritte · M = Menü<br>
    <b>Mit Meta Quest:</b> Seite im Quest-Browser öffnen → „ENTER VR“ · Trigger oder Pinch = auswählen
  </div>
  <div id="ui"></div>
  <div id="boot" role="status" aria-live="polite">
    <div class="logo" aria-hidden="true">🕌</div>
    <h1>NamazVR</h1>
    <div class="spin" aria-hidden="true"></div>
    <p id="boot-msg"></p>
    <button type="button" onclick="location.reload()"></button>
  </div>
  <script>
    // Ladeanzeige in der Sprache des Geräts; Fehlermeldung, wenn die App nicht startet (z. B. ohne Internet beim ersten Besuch)
    (function () {
      var T = {
        de: ['Wird geladen …', 'NamazVR konnte nicht geladen werden. Prüfe deine Internetverbindung und versuche es noch einmal.', 'Neu laden'],
        tr: ['Yükleniyor …', 'NamazVR yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.', 'Yeniden yükle'],
        en: ['Loading …', 'NamazVR could not be loaded. Check your internet connection and try again.', 'Reload'],
        ar: ['جارٍ التحميل …', 'تعذّر تحميل NamazVR. تحقّق من اتصالك بالإنترنت ثم حاول مرة أخرى.', 'إعادة التحميل']
      };
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('salahvr.lang')); } catch (e) { /* privater Modus */ }
      var L = T[saved] || T[(navigator.language || 'de').slice(0, 2)] || T.de;
      var boot = document.getElementById('boot');
      document.getElementById('boot-msg').textContent = L[0];
      boot.querySelector('button').textContent = L[2];
      function fail() { if (!boot.isConnected || boot.classList.contains('gone')) return; boot.classList.add('err'); boot.setAttribute('role', 'alert'); document.getElementById('boot-msg').textContent = L[1]; }
      // Skript nicht ladbar oder Fehler beim Start (Schriften und Bilder zählen nicht)
      window.addEventListener('error', function (e) { if (!e.target || e.target === window || e.target.tagName === 'SCRIPT') fail(); }, true);
      setTimeout(fail, 25000);
      window.__bootDone = function () { boot.classList.add('gone'); setTimeout(function () { boot.remove(); }, 400); };
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
